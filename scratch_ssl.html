<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSL 证书申请 - Keycloak Auth Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error { color: #dc3545; }
        .success { color: #198754; }
        .info { color: #0d6efd; }
        #logs { 
            background: #212529; 
            color: #f8f9fa; 
            padding: 15px; 
            border-radius: 5px; 
            height: 300px; 
            overflow-y: auto; 
            font-family: monospace;
            font-size: 14px;
        }
        #logs div { margin-bottom: 5px; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid px-3 mt-4">
    <h2>🔒 SSL 证书自动化</h2>
    <a href="/" class="btn btn-outline-secondary mb-3">← 返回</a>
    
    <div class="card shadow-sm">
        <div class="card-body">
            <form id="sslForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">选择网站域名 <span class="text-danger">*</span></label>
                    <select name="domain" id="domain" class="form-select form-select-lg" required>
                        <option value="">正在加载已配置的域名...</option>
                    </select>
                    <small class="text-muted">只列出了本工具管理的域名</small>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">选择 ACME 账号 <span class="text-danger">*</span></label>
                    <select class="form-select form-select-lg" id="acmeId" required>
                        <option value="">正在加载 1Panel 账号...</option>
                    </select>
                    <small class="text-muted">请先在 1Panel 中配置好 ACME 账号</small>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold">选择 DNS 验证账号 (可选)</label>
                    <select class="form-select form-select-lg" id="dnsId">
                        <option value="">加载中 / 不使用 DNS</option>
                    </select>
                    <small class="text-muted">留空则使用 HTTP 验证 (要求域名已解析到当前服务器 IP)</small>
                </div>
                
                <button type="submit" id="submitBtn" class="btn btn-success btn-lg w-100">
                    🚀 立即申请并绑定证书
                </button>
            </form>
        </div>
    </div>
    
    <div class="card shadow-sm mt-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>📋 实时日志</span>
            <span id="statusBadge" class="badge bg-secondary">等待操作</span>
        </div>
        <div class="card-body">
            <div id="logs">等待开始...</div>
        </div>
    </div>
</div>

<script>
let eventSource = null;

async function loadInitData() {
    try {
        // 加载域名列表
        const domainsRes = await fetch('/api/list');
        const domainsData = await domainsRes.json();
        const domainSelect = document.getElementById('domain');
        const domains = Object.keys(domainsData);
        domainSelect.innerHTML = domains.length > 0 
            ? '<option value="">请选择域名...</option>' + domains.map(d => `<option value="${d}">${d}</option>`).join('')
            : '<option value="">未找到任何配置过的域名</option>';

        // 加载 ACME 账号
        const acmeRes = await fetch('/api/acme_accounts');
        const acmeData = await acmeRes.json();
        const acmeSelect = document.getElementById('acmeId');
        acmeSelect.innerHTML = acmeData.length > 0 
            ? acmeData.map(a => `<option value="${a.id}">${a.email}</option>`).join('')
            : '<option value="">未在 1Panel 找到 ACME 账号</option>';
            
        // 加载 DNS 账号
        const dnsRes = await fetch('/api/dns_accounts');
        const dnsData = await dnsRes.json();
        const dnsSelect = document.getElementById('dnsId');
        dnsSelect.innerHTML = '<option value="">(不使用 DNS 验证)</option>' + 
            dnsData.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
    } catch (e) {
        console.error("加载初始数据失败", e);
    }
}

document.addEventListener('DOMContentLoaded', loadInitData);

document.getElementById('sslForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const domain = document.getElementById('domain').value;
    const acmeId = document.getElementById('acmeId').value;
    const dnsId = document.getElementById('dnsId').value;
    
    const btn = document.getElementById('submitBtn');
    const logs = document.getElementById('logs');
    const status = document.getElementById('statusBadge');
    
    if (!domain || !acmeId) {
        alert('请选择域名和 ACME 账号');
        return;
    }
    
    // 禁用按钮
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>申请中...';
    status.className = 'badge bg-warning';
    status.textContent = '处理中';
    logs.innerHTML = '';
    
    // 连接 SSE 日志
    if (eventSource) eventSource.close();
    eventSource = new EventSource('/api/logs');
    
    eventSource.onmessage = function(e) {
        if (e.data === 'heartbeat') return;
        if (e.data) {
            const line = document.createElement('div');
            line.textContent = e.data;
            if (e.data.includes('失败') || e.data.includes('Error')) {
                line.className = 'error';
            } else if (e.data.includes('成功') || e.data.includes('完成') || e.data.includes('就绪')) {
                line.className = 'success';
            } else {
                line.className = 'info';
            }
            logs.appendChild(line);
            logs.scrollTop = logs.scrollHeight;
        }
    };
    
    // 发送申请请求
    try {
        const formData = new FormData();
        formData.append('domain', domain);
        formData.append('acme_id', acmeId);
        if (dnsId) formData.append('dns_id', dnsId);
        
        const response = await fetch('/api/apply_ssl', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        
        if (result.success) {
            status.className = 'badge bg-success';
            status.textContent = '完成';
            btn.innerHTML = '✅ 证书已就绪';
        } else {
            status.className = 'badge bg-danger';
            status.textContent = '失败';
            btn.innerHTML = '❌ 申请失败';
            alert('错误: ' + result.error);
        }
    } catch (err) {
        console.error(err);
        status.className = 'badge bg-danger';
        status.textContent = '异常';
        btn.innerHTML = '❌ 提交异常';
    } finally {
        btn.disabled = false;
        if (eventSource) {
            setTimeout(() => { eventSource.close(); eventSource = null; }, 2000);
        }
    }
});
</script>
</body>
</html>
